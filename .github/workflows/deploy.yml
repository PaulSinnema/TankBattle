name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish TankBattle/TankBattle.csproj -c Release -o release

      - name: Prepare for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' TankBattle/TankBattle.csproj)
          cd release/wwwroot
          # User/org site (<name>.github.io) is served from root
          if [[ "$REPO" != *.github.io ]]; then
            sed -i "s|<base href=\"/\" />|<base href=\"/$REPO/\" />|" index.html
          fi
          cp index.html 404.html
          touch .nojekyll
          # Polled by the app to detect new deployments
          echo "{\"version\":\"$VERSION\"}" > version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
