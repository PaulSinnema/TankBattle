<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tank Battle</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: system-ui, "Segoe UI", Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #app { height: 100%; }
        .scene { position: fixed; inset: 0; }
        .scene canvas { display: block; }
        .version { position: fixed; top: 8px; right: 12px; z-index: 40; font-size: 14px; opacity: .9; text-shadow: 0 0 3px #000; }
        .hud { position: fixed; top: 8px; left: 12px; z-index: 10; font-size: 16px; line-height: 1.5; text-shadow: 0 0 3px #000; }
        .health { width: 180px; height: 12px; margin-top: 4px; border: 1px solid #fff; background: rgba(0,0,0,.4); }
        .health-bar { height: 100%; background: #4c4; transition: width .2s; }
        .crosshair { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; z-index: 10; pointer-events: none; }
        .minimap { position: fixed; top: 32px; right: 12px; width: 140px; height: 140px; z-index: 10; border: 1px solid rgba(255,255,255,.5); }
        .overlay { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(0,0,0,.55); }
        .overlay.banner { background: none; pointer-events: none; text-shadow: 0 0 6px #000; }
        .overlay h1 { margin: 0 0 12px; font-size: 44px; letter-spacing: 4px; }
        .overlay button { margin-top: 22px; padding: 10px 34px; font-size: 22px; border: 0; border-radius: 6px; background: #c8a63c; color: #111; cursor: pointer; }
        .controls { font-size: 15px; line-height: 1.7; opacity: .9; }
        .touch { position: fixed; left: 0; right: 0; bottom: 16px; z-index: 15; display: none; justify-content: space-between; align-items: flex-end; padding: 0 16px; pointer-events: none; }
        @media (pointer: coarse) { .touch { display: flex; } }
        .touch .pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 58px); gap: 6px; pointer-events: auto; }
        .touch button { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.45); color: #fff; border-radius: 10px; font-size: 22px; touch-action: none; }
        .touch .fire { width: 92px; height: 92px; border-radius: 50%; background: rgba(220,60,40,.55); font-size: 16px; pointer-events: auto; }
        /* Mobile: safe areas, compact HUD, rotate hint */
        .version { top: calc(8px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
        .hud { top: calc(8px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); }
        .minimap { top: calc(32px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
        .touch { bottom: calc(16px + env(safe-area-inset-bottom)); padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); }
        .touch button { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        .rotate { display: none; position: fixed; inset: 0; z-index: 60; background: #000; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 20px; padding: 24px; }
        .rotate span { font-size: 64px; margin-bottom: 16px; }
        @media (pointer: coarse) and (orientation: portrait) { .rotate { display: flex; } }
        @media (max-height: 500px), (max-width: 600px) {
            .hud { font-size: 13px; line-height: 1.35; }
            .health { width: 110px; height: 9px; }
            .minimap { width: 96px; height: 96px; top: calc(28px + env(safe-area-inset-top)); }
            .version { font-size: 12px; }
            .overlay h1 { font-size: 30px; letter-spacing: 2px; }
            .overlay button { margin-top: 14px; font-size: 18px; }
            .controls { font-size: 13px; line-height: 1.5; }
            .touch .pad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); }
            .touch .fire { width: 84px; height: 84px; }
        }
        #blazor-error-ui { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 8px 12px; background: #b32121; }
        #blazor-error-ui .dismiss { float: right; cursor: pointer; }
    </style>
    <script type="importmap"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Auto-update + recovery from stale cached HTML (GitHub Pages caches ~10 min)
        (function () {
            const KEY = 'tb-recover';
            function reloadFresh(param, value) {
                const url = new URL(location.href);
                url.searchParams.set(param, value);
                location.replace(url.toString());
            }
            function recover() {
                const n = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (n >= 2) return;
                sessionStorage.setItem(KEY, String(n + 1));
                reloadFresh('r', Date.now());
            }
            window.tbRecover = recover;
            const watchdog = setTimeout(recover, 45000);
            let current = null;
            async function check() {
                if (!current) return;
                try {
                    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.version && data.version !== current) reloadFresh('v', data.version);
                } catch { }
            }
            window.tbUpdater = {
                start(version) {
                    current = version;
                    clearTimeout(watchdog);
                    sessionStorage.removeItem(KEY);
                    check();
                    setInterval(check, 60000);
                    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
                    window.addEventListener('focus', check);
                }
            };
        })();
    </script>
</head>
<body>
    <div id="app"></div>
    <div id="blazor-error-ui">
        Er is een fout opgetreden. <a href="." class="reload">Herladen</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" onerror="tbRecover()"></script>
</body>
</html>
